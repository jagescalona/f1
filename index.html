:root, [data-tema="oscuro"] {
  --fondo: #14171C; --sup: #1E232B; --sup2: #252B35; --tecla: #2A313C; --canto: #0D0F13; --linea: #2E3542;
  --txt: #EEF1F4; --tenue: #A7B0BC; --azul: #6CA8FF; --azul-txt: #0B1B33; --azul-fondo: #17263D;
  --verde: #3CCB7F; --verde-fondo: #12291D; --ambar: #F5B841; --ambar-fondo: #33270F; --rojo: #FF6B5E; --rojo-fondo: #3A1F1D;
  --pant: #F4F4F4; --pant-txt: #1B1B1B; --pant-borde: #C9C9C9; --pant-sel: #CCE4F7; --pant-acc: #005FB8;
  --sombra: 0 1px 0 rgba(0,0,0,.4); color-scheme: dark;
}
[data-tema="claro"] {
  --fondo: #F3F1EC; --sup: #FFFFFF; --sup2: #F8F6F1; --tecla: #FFFFFF; --canto: #CFC9BC; --linea: #DDD8CC;
  --txt: #1B1F24; --tenue: #5A6470; --azul: #1F5FD6; --azul-txt: #FFFFFF; --azul-fondo: #E3ECFB;
  --verde: #1B6B3F; --verde-fondo: #E2F2E8; --ambar: #8A5A00; --ambar-fondo: #FBEFD5; --rojo: #8E2219; --rojo-fondo: #FBE5E2;
  --sombra: 0 1px 0 rgba(0,0,0,.06); color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-tema]) {
    --fondo: #F3F1EC; --sup: #FFFFFF; --sup2: #F8F6F1; --tecla: #FFFFFF; --canto: #CFC9BC; --linea: #DDD8CC;
    --txt: #1B1F24; --tenue: #5A6470; --azul: #1F5FD6; --azul-txt: #FFFFFF; --azul-fondo: #E3ECFB;
    --verde: #1B6B3F; --verde-fondo: #E2F2E8; --ambar: #8A5A00; --ambar-fondo: #FBEFD5; --rojo: #8E2219; --rojo-fondo: #FBE5E2;
    --sombra: 0 1px 0 rgba(0,0,0,.06); color-scheme: light;
  }
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--fondo); color: var(--txt); font: 400 1.0625rem/1.5 'F1 Texto', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--azul); }
b, strong { font-weight: 700; }
.mono, kbd, code { font-family: 'F1 Mono', ui-monospace, Consolas, monospace; }
.tenue { color: var(--tenue); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
#app { max-width: 46rem; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.cab { position: sticky; top: 0; z-index: 5; background: var(--fondo); display: flex; align-items: center; gap: .5rem; padding: .625rem .75rem; border-bottom: 1px solid var(--linea); }
.cab h1 { flex: 1; min-width: 0; margin: 0; font-size: 1.0625rem; font-weight: 700; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cab .cuenta { color: var(--tenue); font-size: .9375rem; white-space: nowrap; }
.cuerpo { flex: 1; padding: .875rem .875rem 1.25rem; display: flex; flex-direction: column; gap: .875rem; }
.pie { position: sticky; bottom: 0; z-index: 5; background: var(--fondo); border-top: 1px solid var(--linea); padding: .625rem .75rem calc(.625rem + env(safe-area-inset-bottom)); display: grid; gap: .5rem; }
.pie.tres { grid-template-columns: 3.5rem 1fr 1.4fr; }
.pie.dos { grid-template-columns: 1fr 1.4fr; }
.pie.uno { grid-template-columns: 1fr; }
.k { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 3rem; padding: .625rem .875rem; border-radius: .75rem;
  background: var(--tecla); border: 1px solid var(--canto); border-bottom-width: 3px; box-shadow: var(--sombra); cursor: pointer; text-decoration: none; color: var(--txt);
  font-weight: 700; line-height: 1.2; text-align: center; -webkit-tap-highlight-color: transparent; transition: transform .06s, border-bottom-width .06s; }
.k:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 1px; }
.k.prim { background: var(--azul); border-color: color-mix(in srgb, var(--azul) 60%, #000); color: var(--azul-txt); }
.k.plana { background: transparent; border-color: transparent; box-shadow: none; }
.k.peq { min-height: 2.5rem; padding: .375rem .625rem; font-size: .9375rem; }
.k.ico { min-width: 3rem; padding: .5rem; }
.k:disabled { opacity: .45; cursor: not-allowed; }
.k.ancha { display: flex; width: 100%; justify-content: flex-start; text-align: left; font-weight: 400; gap: .75rem; padding: .75rem .875rem; }
.k.ancha .tt { font-weight: 700; display: block; }
.k.ancha .sub { color: var(--tenue); font-size: .9375rem; display: block; }
.k.ancha .der { margin-left: auto; color: var(--tenue); }
.k.ancha.apagada { background: var(--sup); cursor: default; border-bottom-width: 1px; box-shadow: none; }
.k.ancha.apagada .tt { color: var(--tenue); font-weight: 400; }
.k.si { border-color: var(--azul); outline: 2px solid var(--azul); outline-offset: -1px; }
.ic { width: 1.5rem; height: 1.5rem; flex: none; display: inline-block; vertical-align: -.3em; }
.ic svg { width: 100%; height: 100%; display: block; }
kbd { display: inline-block; min-width: 1.6em; padding: .05em .4em .1em; border-radius: .35em; border: 1px solid var(--canto); border-bottom-width: 3px;
  background: var(--tecla); color: var(--txt); font-size: .92em; font-weight: 700; line-height: 1.3; text-align: center; white-space: nowrap; }
.mas { color: var(--tenue); padding: 0 .1em; }
.pant { font-style: normal; }
.g { text-decoration: underline dotted; text-underline-offset: .2em; text-decoration-thickness: 2px; cursor: help; background: none; border: 0; padding: 0; color: inherit; font: inherit; }
.marca { display: flex; align-items: center; gap: .75rem; }
.logo { display: inline-flex; align-items: center; justify-content: center; width: 3.25rem; height: 3rem; border-radius: .75rem; background: var(--tecla);
  border: 1px solid var(--canto); border-bottom-width: 4px; color: var(--azul); font: 700 1.375rem/1 'F1 Mono', ui-monospace, monospace; flex: none; }
.marca .nom { font-weight: 700; font-size: 1.125rem; line-height: 1.2; }
.marca .rev { color: var(--tenue); font-size: .875rem; }
.lema { margin: 0; font-size: 1.375rem; line-height: 1.25; font-weight: 700; }
.busca { display: flex; align-items: center; gap: .5rem; border: 1px solid var(--linea); background: var(--sup); border-radius: .75rem; padding: 0 .75rem; }
.busca input { flex: 1; min-width: 0; border: 0; background: transparent; padding: .75rem 0; outline: none; font-size: 1.0625rem; }
.estante h2 { margin: .25rem 0 .5rem; font-size: .9375rem; color: var(--tenue); font-weight: 400; text-transform: none; }
.estante .lista { display: grid; gap: .5rem; }
.seguir { background: var(--sup); border-radius: .75rem; padding: .875rem; display: block; color: var(--txt); text-decoration: none; border: 1px solid var(--linea); }
.seguir .tt { font-weight: 700; }
.barra { height: .375rem; border-radius: .2rem; background: var(--tecla); margin-top: .625rem; overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--azul); border-radius: .2rem; }
.vacio { color: var(--tenue); font-size: .9375rem; }
.en-camino ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.en-camino li { display: flex; align-items: center; gap: .625rem; padding: .375rem .25rem; color: var(--tenue); font-size: .9375rem; border-bottom: 1px solid var(--linea); }
.en-camino li .ic { width: 1.125rem; height: 1.125rem; }
.en-camino li .tipo { margin-left: auto; font-size: .8125rem; }
.chul li.tuyo { background: var(--azul-fondo); border-radius: .5rem; }
.marca-tuyo { color: var(--azul); white-space: nowrap; }
.acerca { color: var(--tenue); font-size: .875rem; }
.acerca p { margin: .25rem 0; }
.tarjeta { background: var(--sup); border: 1px solid var(--linea); border-radius: .875rem; padding: .875rem; }
.tarjeta h2, .tarjeta h3 { margin: 0 0 .5rem; font-size: 1.125rem; line-height: 1.3; }
.datos { display: flex; flex-wrap: wrap; gap: .375rem .875rem; color: var(--tenue); font-size: .9375rem; }
.lista-c { list-style: none; margin: 0; padding: 0; display: grid; gap: .375rem; }
.casilla { display: flex; gap: .625rem; align-items: flex-start; cursor: pointer; padding: .25rem 0; }
.casilla input { appearance: none; -webkit-appearance: none; flex: none; width: 1.5rem; height: 1.5rem; margin: 0; border: 2px solid var(--tenue); border-radius: .375rem; background: var(--sup); display: grid; place-content: center; cursor: pointer; }
.casilla input::after { content: ''; width: .45rem; height: .8rem; border: solid var(--azul-txt); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
.casilla input:checked { background: var(--azul); border-color: var(--azul); }
.casilla input:checked::after { opacity: 1; }
.pregunta { display: grid; gap: .5rem; margin-top: .25rem; }
.pregunta + .pregunta { margin-top: .875rem; }
.pregunta .q { font-weight: 700; }
.ops { display: flex; flex-wrap: wrap; gap: .5rem; }
.ops .k { flex: 1 1 8rem; font-weight: 400; }
.ops .k[aria-pressed="true"] { background: var(--azul-fondo); border-color: var(--azul); color: var(--txt); font-weight: 700; }
.nota { font-size: .9375rem; color: var(--tenue); margin: 0; }
.aviso { display: flex; gap: .625rem; align-items: flex-start; border-radius: .75rem; padding: .75rem; margin: 0; }
.aviso .ic { margin-top: .1rem; }
.aviso.ambar { background: var(--ambar-fondo); color: var(--txt); } .aviso.ambar .ic { color: var(--ambar); }
.aviso.rojo { background: var(--rojo-fondo); } .aviso.rojo .ic { color: var(--rojo); }
.aviso.verde { background: var(--verde-fondo); } .aviso.verde .ic { color: var(--verde); }
.aviso.azul { background: var(--azul-fondo); } .aviso.azul .ic { color: var(--azul); }
.botones { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.fases { display: flex; gap: .375rem; overflow-x: auto; scrollbar-width: none; margin: 0 -.875rem; padding: 0 .875rem; }

      { id: 'p06', riesgo: 'r', aviso: 'el pendrive se borra entero', titulo: 'Enchufa el pendrive y asegúrate de cuál es',
        hacer: ['Quita **todos los demás** pendrives y discos USB del PC donde lo vas a crear (también el de la copia).',
          'Enchufa el pendrive y mira en el Explorador su nombre, su letra y su tamaño (por ejemplo, «MARIO (D:)», de 16 GB).',
          'Si tiene algo que quieras, cópialo ahora.'],
        freno: ['He quitado los demás pendrives y discos USB', 'Este pendrive no tiene nada que quiera conservar'],
        porque: 'Media Creation Tool y Rufus borran la unidad que elijas, sin papelera. Con un solo USB enchufado, no te puedes equivocar.' },
      { id: 'p07', riesgo: 'a', aviso: 'elige bien la unidad y las casillas', titulo: 'Crea el pendrive', requiere: 'herr',
        hacer: [
          { solo: { herr: 'mct' }, t: 'Abre la herramienta (pide permiso de administrador) y, en «Términos de licencia y avisos aplicables», «Aceptar».' },
          { solo: { herr: 'mct' }, t: 'En «Seleccionar idioma y edición»: si lo creas en el mismo PC, deja «Usa las opciones recomendadas para este equipo»; si no, quítala y elige Español, Windows 11 y 64 bits. «Siguiente».' },
          { solo: { herr: 'mct' }, t: '«Elija que medio usar»: **«Unidad flash USB»** y «Siguiente».' },
          { solo: { herr: 'mct' }, t: 'Elige tu pendrive en la lista («Unidades extraíbles») y «Siguiente». Baja Windows y lo escribe: espera. Al final, «Su unidad flash USB está lista» y «Finalizar».' },
          { solo: { herr: 'rufus' }, t: 'Abre Rufus (pide permiso de administrador). La primera vez pregunta si busca actualizaciones y si baja los archivos DBX: contesta lo que quieras, no cambia el pendrive.' },
          { solo: { herr: 'rufus' }, t: 'En «Dispositivo», tu pendrive (mira la letra y el tamaño, por ejemplo «MARIO (D:) [16 GB]»).' },
          { solo: { herr: 'rufus' }, t: 'En «Elección de arranque», «Disco o imagen ISO»; pulsa «SELECCIONAR» y elige la ISO que bajaste.' },
          { solo: { herr: 'rufus' }, t: 'Al elegir la ISO, Rufus pone solo «Esquema de partición»: **GPT** y «Sistema de destino»: **UEFI (no CSM)**. Compruébalo; lo demás, como está. Pulsa «EMPEZAR».' },
          { solo: { herr: 'rufus' }, t: 'Sale «Experiencia de usuario de Windows» con varias casillas ya marcadas. Deja marcadas **solo** estas:' },
          { solo: { herr: 'rufus', reqEf: 'no' }, t: '✅ «Eliminar el requisito de más de 4 GB de RAM, Arranque seguro y TPM 2.0» (tu PC no cumple).' },
          { solo: { herr: 'rufus', reqEf: 'si' }, t: '⬜ Quita «Eliminar el requisito de más de 4 GB de RAM, Arranque seguro y TPM 2.0»: tu PC cumple.' },
          { solo: { herr: 'rufus', cuenta: 'local' }, t: '✅ «Eliminar el requisito de una cuenta de Microsoft en línea» y ✅ «Crear una cuenta local con nombre de usuario:». En el nombre viene tu usuario de este PC: cámbialo por el del dueño, sin espacios ni tildes (por ejemplo, «ana»).' },
          { solo: { herr: 'rufus', cuenta: 'local' }, t: '✅ «Deshabilitar el cifrado automático de dispositivos BitLocker».' },
          { solo: { herr: 'rufus', cuenta: 'ms' }, t: '⬜ Quita «Eliminar el requisito de una cuenta de Microsoft en línea» y «Crear una cuenta local con nombre de usuario:»: el dueño usará su cuenta Microsoft.' },
          { solo: { herr: 'rufus' }, t: 'Las demás, sin marcar. Pulsa «OK». Si alguna vez ves «⚠EN SILENCIO⚠ borrar el disco e instalar:», **nunca** la marques.' },
          { solo: { herr: 'rufus' }, t: 'Al aviso «ADVERTENCIA: TODOS LOS DATOS EN LA UNIDAD … SERÁN ELIMINADOS.», mira que la unidad es tu pendrive y pulsa «OK». Tarda: con un pendrive de 16 GB, unos 45 minutos (más con uno lento); cuando vuelva a poner «PREPARADO», «CERRAR».' },
          { solo: { herr: null }, t: 'Antes, responde en {p:p04} si cumple los requisitos: de eso depende la herramienta.' }],
        escena: function (c) { return c.herr === 'mct' ? 'mct-usb' : c.herr === 'rufus' ? ['rufus', 'rufus-wue'] : null; },
        dato: { solo: { herr: 'rufus' }, et: 'En Rufus', v: 'GPT · UEFI (no CSM)' },
        porque: [{ solo: { herr: 'mct' }, t: 'Media Creation Tool es la de Microsoft: baja la última versión y lo deja hecho. No quita requisitos ni la cuenta Microsoft; por eso es la de tu caso y no la de los otros.' },
          { solo: { herr: 'rufus' }, t: 'Rufus escribe la ISO y, con «Experiencia de usuario de Windows», prepara la instalación para quitar los requisitos o la cuenta Microsoft. GPT y UEFI, porque así arrancan los PC de hoy y lo pide Windows 11. «EN SILENCIO» borra el primer disco que encuentre sin preguntar: en un PC con datos, una catástrofe.' }],
        fallos: [
          { solo: { herr: 'mct' }, s: '«No podemos encontrar una unidad flash USB.»', r: 'Enchufa el pendrive en otro puerto y pulsa «Actualizar la lista de unidades».' },
          { solo: { herr: 'mct' }, s: '«Se produjo un problema al ejecutar esta herramienta.»', r: 'Reinicia el PC y vuelve a abrirla. Si sigue, haz el pendrive con Rufus y la ISO (de 16 GB): es igual de bueno.' },
          { solo: { herr: 'rufus' }, s: '«Ubicación de imagen no compatible»', r: 'La ISO está dentro del pendrive que vas a borrar. Muévela a otra carpeta del PC y vuelve a «SELECCIONAR».' },
          { solo: { herr: 'rufus' }, s: 'El pendrive no sale en «Dispositivo»', r: 'Otro puerto. Si es un disco USB y no un pendrive, abre «Mostrar propiedades avanzadas de la unidad» y marca «Listar los discos duros USB».' },
          { solo: { herr: 'rufus' }, s: 'Dice que no cabe o que el pendrive es pequeño', r: 'Con Rufus hace falta uno de 16 GB: la ISO ocupa 9 GB.' }] },
      { id: 'p08', riesgo: 'v', titulo: 'Expúlsalo bien',
        hacer: ['Si bajaste controladores ({p:p03}), cópialos al pendrive, en una carpeta «drivers».',
          'En la barra de tareas, «Quitar hardware de forma segura y expulsar el medio» › «Expulsar» tu pendrive (con Rufus se llama ya como la ISO, «CCCOMA_…»). Cuando lo diga, quítalo.',
          { solo: { donde: 'este' }, t: 'Como vas a instalar en este mismo PC, vuelve a enchufarlo: lo necesitas puesto.' }],
        porque: 'Quitarlo mientras escribe puede dejarlo a medias, y después no arranca.' }
    ] },
    { titulo: 'Arrancar desde él', pasos: [
      { id: 'p09', riesgo: 'a', aviso: 'con otros discos enchufados es fácil equivocarse', titulo: 'Apaga y deja solo lo necesario',
        hacer: ['En el PC donde vas a instalar: Inicio › Apagar **con {k:Mayús} pulsada**, para que se apague del todo.',
          'Desenchufa discos USB, otros pendrives y tarjetas de memoria. Deja teclado, ratón, el cable de red si lo hay y **tu pendrive** (en un sobremesa, mejor en un puerto de detrás).',
          'Si el PC tiene **otro disco por dentro con datos** y sabes hacerlo: quita la corriente y desconecta el cable de datos de ese disco (su etiqueta dice la capacidad: 1 TB, 240 GB…); lo vuelves a conectar al terminar. Si no, en {p:p16} reconócelo por su tamaño y no lo toques.',
          'Si es portátil, con el cargador.'],
        porque: 'Todo lo que esté conectado sale en la lista de discos de {p:p16}. Cuantos menos, menos riesgo. Con el apagado normal, Windows no se apaga del todo («inicio rápido») y a veces la tecla de {p:p10} no llega a tiempo.' },
      { id: 'p10', riesgo: 'v', titulo: 'Enciende y saca el menú de arranque',
        widget: 'teclas',
        hacer: ['Pulsa encender y, **desde ese momento**, la tecla del {g:menú de arranque} varias veces seguidas (en un ASUS portátil, mantén {k:Esc} pulsada y enciende).',
          'Si Windows aún arranca, otro camino: Configuración › «Sistema» › «Recuperación» › «Inicio avanzado» › «Reiniciar ahora»; en «Elegir una opción», «Usar un dispositivo».'],
        escena: 'arranque',
        porque: 'El menú de arranque elige el pendrive solo esta vez, sin cambiar nada de la BIOS: si el disco está cifrado, tocar la BIOS puede hacer que Windows pida la clave de {g:BitLocker}.',
        fallos: [
          { s: 'Arranca el Windows de siempre', r: 'Llegaste tarde. Usa **Reiniciar** (no Apagar) y pulsa la tecla en cuanto se apague la pantalla. O, desde Windows, el inicio avanzado: Inicio › botón de encendido › mantén {k:Mayús} y pulsa Reiniciar; sale «Elegir una opción» › «Usar un dispositivo».' },
          { s: 'La tecla no hace nada', r: 'Prueba con {k:Fn} y la tecla. Con un teclado USB, en otro puerto. Mira la nota de tu marca en {u:U02}.' },
          { s: 'Pide una contraseña de BIOS', r: 'Es del dueño o de la empresa. Sin ella, no sigas: no se quita por las bravas.' }] },
      { id: 'p11', riesgo: 'v', titulo: 'Elige el pendrive',
        hacer: ['Con las flechas, elige la entrada que lleva **UEFI** (o EFI) y la **marca del pendrive** (SanDisk, Kingston…; no su nombre de Windows), y {k:Intro}.',
          'Si sale dos veces, una con UEFI y otra sin: la de UEFI.',
          { solo: { herr: 'rufus' }, t: 'Con el pendrive de Rufus sale antes, unos segundos, una pantalla negra con letras («UEFI:NTFS» arriba): es normal, no pulses nada.' },
          'Arranca el instalador: «Seleccionar configuración de idioma».'],
        escena: 'menu-arranque',
        porque: 'Si arrancas la entrada sin UEFI, el instalador va en modo antiguo ({g:BIOS}) y en {p:p16} no deja instalar en un disco {g:GPT}.',
        fallos: [
          { s: 'El pendrive no sale en el menú', r: 'Otro puerto (mejor de detrás o un USB 2.0) o rehaz el pendrive. Si sigue sin salir, en la {g:UEFI} puede estar prohibido arrancar desde USB: mira {u:U02}.' },
          { s: 'Solo sale la entrada sin UEFI', r: 'El PC arranca en modo antiguo (BIOS). Si su UEFI deja cambiarlo a UEFI, cámbialo ({u:U02}). Si es tan antiguo que no tiene UEFI, rehaz el pendrive en Rufus con «Esquema de partición» MBR y «Sistema de destino» «BIOS (o UEFI-CSM)».' },
          { s: 'Pide la clave de recuperación de BitLocker', r: 'Has cambiado algo del arranque con el disco cifrado. No sigas a ciegas: la clave está en la cuenta Microsoft del dueño. Si ya tienes la copia y vas a borrar el disco, no la necesitas: apaga y vuelve a {p:p10}.', ir: { u: 'U03', nodo: 'r-bitlocker', t: 'Dónde buscar la clave de BitLocker' } }] }
    ] },
    { titulo: 'Instalar', pasos: [
      { id: 'p12', riesgo: 'v', titulo: 'Idioma y teclado',
        hacer: ['«Seleccionar configuración de idioma»: deja «Español (España, internacional)» en «Idioma para instalar» y en «Formato de hora y moneda». «Siguiente».',
          '«Seleccionar configuración de teclado»: Español. «Siguiente».'] },
      { id: 'p13', riesgo: 'a', aviso: 'aún no borra nada: lo hace {p:p16}', titulo: 'Elige «Instalar Windows 11» y acepta borrarlo todo',
        hacer: ['«Seleccionar opción de configuración»: «Instalar Windows 11».',
          'Marca «Acepto que se elimine todo, incluidos los archivos, las aplicaciones y la configuración» y «Siguiente».'],
        escena: 'opcion',
        porque: 'Es una instalación limpia: no conserva nada del sistema viejo. La otra opción, «Reparar mi PC», es para arreglar un Windows que no arranca.',
        fallos: [{ s: '«Siguiente» está gris y no se puede pulsar', r: 'Falta marcar la casilla «Acepto que se elimine todo…»: sin ella no deja seguir. Todavía no borra nada.' }] },
      { id: 'p14', riesgo: 'a', aviso: 'la edición tiene que ser la que tenía', titulo: '«No tengo clave de producto» y la misma edición',
        hacer: ['Si pide la clave: «No tengo clave de producto». Windows se activa solo después, con la {g:licencia digital} del PC.',
          'Si sale «Seleccionar imagen»: la **edición que apuntaste** en {p:p03} (Windows 11 Home o Windows 11 Pro; en algunos portátiles, «Home Single Language»). «Siguiente».',
          'Si no te pide ni clave ni edición, mejor: el PC trae su clave dentro y el instalador ya ha elegido.'],
        escena: 'clave',
        porque: 'La licencia es de una edición. Con otra, Windows no se activa y pide comprar una clave.',
        fallos: [{ s: 'No sabes qué edición tenía', r: 'Un portátil de tienda casi siempre es Home; uno de empresa o de clase, Pro. Si te equivocas, en {p:p24} pondrá «No está activo»: reinstala con la buena.' },
          { s: 'Tras la edición sale «Este equipo no cumple actualmente los requisitos del sistema de Windows 11» (o «La instalación del Windows 11 no puede continuar»)', r: 'Debajo, en «Explicamos por qué:», dice qué falla. Si es el TPM, el arranque seguro o la memoria, el PC no cumple: vuelve a {p:p07}, con Rufus, y deja marcada «Eliminar el requisito de más de 4 GB de RAM, Arranque seguro y TPM 2.0». Antes, lee el aviso de la portada y díselo al dueño.' },
          { s: '«El procesador debe tener dos o más núcleos.»', r: 'Rufus no quita este requisito. En un PC de verdad casi no pasa; en una máquina virtual, dale 2 procesadores en su configuración.' },
          { s: 'Dice que el procesador no admite una característica crítica (PopCnt o SSE4.2)', r: 'El procesador es demasiado antiguo para esta versión de Windows 11, ni con Rufus. Para: ese PC necesita otro sistema o cambiarlo.' }] },
      { id: 'p15', riesgo: 'v', titulo: 'Acepta los términos',
        hacer: ['«Términos de licencia y avisos aplicables»: «Aceptar».'] },
      { id: 'p16', riesgo: 'r', aviso: 'este paso borra el disco', titulo: 'Elige el disco y borra sus particiones',
        hacer: ['En «Seleccionar ubicación para instalar Windows 11», busca el disco **por su tamaño** (el que apuntaste en {p:p03}). El pendrive y un disco de datos también salen: **esos no se tocan**.',
          'Elige una {g:partición} de ese disco y pulsa «Eliminar partición»; confirma. Repite con **todas** las de ese disco, y solo las de ese disco.',
          'Cuando de ese disco solo quede «Espacio sin asignar» (por ejemplo, «Disco 0 Espacio sin asignar»), elígelo y «Siguiente». Windows crea solo las particiones que necesita.'],
        freno: ['Sé cuál es el disco por su tamaño: no es el pendrive ni un disco de datos', 'Tengo la copia y la he abierto en otro equipo'],
        escena: 'particiones',
        porque: 'Borrar todas deja el disco limpio, sin restos del sistema viejo ni particiones de recuperación de otra versión, que dan errores. Los tamaños salen un poco menores que en la caja (238 GB en un disco de 256).',
        fallos: [
          { s: 'Te has equivocado de disco', r: '**Para**: no pulses «Siguiente» ni «Instalar». Apaga el PC (mantén el botón) y pide ayuda. Mientras no se escriba nada encima, los datos aún se pueden recuperar.' },
          { s: 'No sale ningún disco', r: 'En un portátil Intel reciente, falta el {g:controlador} del disco (Intel RST o VMD): «Cargar controlador» y elige la carpeta «drivers» del pendrive ({p:p08}). En un sobremesa, mira los cables del disco y que la BIOS lo vea.' },
          { s: 'Salen más discos de los que esperabas', r: 'Reconócelos por el tamaño. Si dudas, apaga y desconecta el que no es; el que tiene datos, no se toca.' },
          { s: '«Windows 11 no se puede instalar en esta unidad.»', r: 'Primero: si el aviso sale en un disco de datos, ese no es: no lo toques. En el disco donde instalas, pulsa «(Mostrar detalles)». Si habla de una tabla de particiones {g:MBR}: borra **todas** sus particiones y usa su espacio sin asignar (el instalador lo prepara solo). Si aún sale, arrancaste el pendrive sin UEFI: reinicia y elige la entrada UEFI ({p:p11}).' },
          { s: 'Sale un disco, pero no del tamaño que apuntaste', r: '**Para**: ese no es. Apaga y mira qué disco está conectado (o cuál desconectaste en {p:p09}).' }] },
      { id: 'p17', riesgo: 'a', aviso: 'en los reinicios, no pulses nada', titulo: 'Instala y deja que se reinicie',
        hacer: ['«Listo para instalar»: «Instalar». Sale «Instalando Windows 11»: espera (de 10 a 30 minutos).',
          'El PC se reinicia solo varias veces. **No pulses ninguna tecla.**',
          'Si vuelve a salir el instalador desde el principio, quita el pendrive y reinicia.'],
        porque: 'El menú de arranque eligió el pendrive solo una vez: al reiniciar, el PC arranca del disco y sigue la instalación. Si en la BIOS el USB va primero, vuelve al instalador.',
        fallos: [
          { s: 'Vuelve a empezar el instalador', r: 'Arranca otra vez desde el pendrive: quítalo y reinicia. Lo instalado sigue donde iba.' },
          { s: 'Se queda en el mismo porcentaje mucho rato', r: 'Con discos lentos tarda: espera media hora más. Si en una hora no avanza, reinicia y repite desde {p:p10}.' }] }
    ] },
    { titulo: 'El primer inicio', pasos: [
      { id: 'p18', riesgo: 'v', titulo: 'País y teclado',
        hacer: ['«¿Es el país o región correcto?»: España y «Sí».',
          'El teclado: Español y «Sí». A «¿Quieres agregar una segunda distribución de teclado?», «Omitir».'] },
      { id: 'p19', riesgo: 'v', titulo: 'Conéctalo a Internet',
        hacer: ['Con cable, se conecta solo. Con wifi, elige la red y escribe su contraseña.',
          'Después busca actualizaciones («Buscando actualizaciones») y puede reiniciar: espera.'],
        fallos: [
          { solo: { cuenta: 'ms' }, s: 'No sale ninguna red', r: 'Falta el controlador de red y la cuenta Microsoft necesita Internet: conecta un cable, un adaptador wifi USB o el móvil como módem por USB.' },
          { solo: { cuenta: 'local' }, s: 'No sale ninguna red', r: 'Con la cuenta local de Rufus se puede seguir sin Internet: elige la opción de no tener conexión. Ya en el escritorio, instala el controlador que copiaste ({p:p23}), o conecta un cable, un adaptador wifi USB o un móvil Android como módem por USB.' }] },
      { id: 'p20', riesgo: 'a', aviso: 'la cuenta es del dueño, no tuya', titulo: 'La cuenta',
        hacer: [
          { solo: { cuenta: 'ms' }, t: 'Si pregunta para qué es el equipo, «Configurar para uso personal».' },
          { solo: { cuenta: 'ms' }, t: 'Escribe el correo de la **cuenta Microsoft del dueño** y su contraseña (o el código que le llega). Si no tiene, que la cree él con «Crear una cuenta».' },
          { solo: { cuenta: 'ms' }, t: 'Te pide un **PIN**: que lo elija el dueño.' },
          { solo: { cuenta: 'local' }, t: 'Rufus ya creó la cuenta con el nombre que escribiste: Windows no pregunta por la cuenta.' },
          { solo: { cuenta: 'local' }, t: 'Al final (después de la privacidad), la primera vez que entra te pide **cambiar la contraseña**: deja la actual en blanco y escribe una nueva dos veces. Apúntala para el dueño, en papel y fuera del PC.' }],
        escena: function (c) { return c.cuenta === 'ms' ? 'cuenta' : null; },
        porque: [{ solo: { cuenta: 'ms' }, t: 'Con la cuenta Microsoft, la licencia y la clave del cifrado quedan guardadas en ella: si un día hacen falta, el dueño las tiene.' },
          { solo: { cuenta: 'local' }, t: 'Rufus crea la cuenta sin contraseña para no pedírtela al hacer el pendrive, y marca que se cambie al entrar. Si el dueño la olvida, no hay forma fácil de recuperarla: por eso, en papel.' }] },
      { id: 'p21', riesgo: 'v', titulo: 'Privacidad y ofertas: lo que no haga falta, no',
        hacer: ['«Elegir la configuración de la privacidad para tu dispositivo»: quita lo que el dueño no quiera («Ubicación», «Encontrar mi dispositivo», «Datos de diagnóstico» opcionales, «Experiencias personalizadas») y «Aceptar».',
          'Las ofertas que vengan después (copia en OneDrive, Microsoft 365, el móvil, juegos): «Omitir» o «Ahora no», salvo que el dueño las quiera.',
          'Al final, «Un momento...» y el escritorio.'] }
    ] },
    { titulo: 'Déjalo listo', pasos: [
      { id: 'p22', riesgo: 'v', titulo: 'Windows Update, hasta que no quede nada',
        hacer: [{ t: 'Si desconectaste un disco de datos ({p:p09}), conéctalo ahora (con el PC apagado y sin corriente).' },
          'Configuración › «Windows Update» › «Buscar actualizaciones». Instala y reinicia cuantas veces pida, hasta que ponga «¡Todo está actualizado!».',
          'Después, «Opciones avanzadas» › «Actualizaciones opcionales»: instala los controladores que salgan.'],
        ir: { u: 'U06', t: 'La puesta a punto completa después de instalar' } },
      { id: 'p23', riesgo: 'v', titulo: 'El Administrador de dispositivos, sin avisos',
        hacer: ['Botón derecho en Inicio › «Administrador de dispositivos».',
          'Si algo lleva un triángulo amarillo, le falta el {g:controlador}: búscalo en «Actualizaciones opcionales» o en la web del fabricante con el modelo que apuntaste.',
          'Si lo tienes en la carpeta «drivers» del pendrive: botón derecho en el dispositivo › «Actualizar controlador» › «Examinar mi PC en busca de controladores» y elige esa carpeta.'] },
      { id: 'p24', riesgo: 'v', titulo: 'Comprueba que está activado',
        hacer: ['Configuración › «Sistema» › «Activación»: en «Estado de activación» tiene que poner «Activo».',
          'Si pone «No está activo», espera unos minutos con Internet. Si sigue, casi siempre es la edición: mira la que tenía ({p:p03}).'],
        escena: 'activo',
        fallos: [{ s: '«No está activo» con la edición buena', r: 'En esa misma página, «Solucionar problemas»: si la licencia estaba en la cuenta Microsoft del dueño, la recupera. Si el PC nunca tuvo licencia de Windows 10 u 11, hace falta una clave.' }] },
      { id: 'p25', riesgo: 'a', aviso: 'sin la clave, los datos pueden quedarse cerrados', titulo: 'El cifrado: la clave, guardada',
        hacer: ['Configuración › «Privacidad y seguridad» › «Cifrado del dispositivo» (en Pro, también «Cifrado de unidad BitLocker» en el Panel de control). Si no sale, el PC no cifra solo: nada que hacer.',
          { solo: { cuenta: 'ms' }, t: 'Si está activado, la clave de recuperación ya está en la cuenta Microsoft del dueño: que lo compruebe en **account.microsoft.com/devicerecoverykeys**.' },
          { solo: { cuenta: 'local' }, t: 'Con cuenta local, en Rufus marcaste que no cifrara. Si aun así sale activado, guarda la clave («Copia de seguridad de la clave de recuperación») en un pendrive o en papel, para el dueño.' },
          'Si un disco de datos estaba cifrado, ábrelo con su clave (la que tenías a mano en {p:p03}).',
          '**Nunca** dejes un disco cifrado sin la clave guardada en algún sitio.'],
        porque: 'Windows 11 cifra el disco solo en muchos PC. Si un día pide la clave (al tocar la BIOS o cambiar la placa) y nadie la tiene, los datos no se recuperan.' },
      { id: 'p26', riesgo: 'v', titulo: 'Devuelve los datos y comprueba la entrega',

        hacer: ['El **certificado digital** no se puede exportar: el dueño tendrá que usar su copia .pfx o pedirlo otra vez.',

          { s: 'Se para con errores de lectura', r: 'El disco de ahora tiene sectores que no se leen: es el paso de la salud. La copia primero ({u:U05}) y, si no se termina, instala de cero en el SSD.' }] }
